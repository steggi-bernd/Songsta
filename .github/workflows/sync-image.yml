# The sync service (sync-server/) as a ready image on GitHub's container registry,
# ghcr.io/<owner>/songsta-sync, for amd64 and arm64 (a Raspberry Pi too), tagged
# with the release's version and `latest`. A running one is updated with
# `docker compose pull && docker compose up -d`. The image says its version at
# /health, and the apps tell when the service is too old for them.
#
# Also attaches songsta-sync.zip (the sync-server folder at that tag) to the
# release, so the zip always matches the image.
#
# Runs automatically on v* tags and manually via workflow_dispatch with a tag
# (builds that tag; leave "attach" off to push the image only).

name: Sync service image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.6.0)'
        required: true
      attach:
        description: 'Attach songsta-sync.zip to that release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Name and version
        id: meta
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/songsta-sync" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sync-server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Check the image says its version
        run: |
          docker run -d --name check -e JELLYFIN_URL=http://127.0.0.1:9 -p 18196:8196 "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18196/health && break; sleep 1; done | tee health.json
          grep -q "\"version\":\"${{ steps.meta.outputs.version }}\"" health.json
          docker rm -f check

      - name: Attach songsta-sync.zip to the release
        if: ${{ github.event_name == 'push' || inputs.attach }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/songsta-sync
          cp sync-server/Dockerfile sync-server/README.md sync-server/docker-compose.yml sync-server/server.mjs out/songsta-sync/
          (cd out && zip -r ../songsta-sync.zip songsta-sync)
          # The release (often still a draft) is made after the tag is pushed.
          for i in $(seq 1 30); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$TAG" songsta-sync.zip --clobber --repo "$GITHUB_REPOSITORY"
